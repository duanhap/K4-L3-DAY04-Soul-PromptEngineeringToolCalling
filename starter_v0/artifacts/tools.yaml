# starter_v0 — intentionally incomplete first-draft declarations.
# Students improve routing guidance, argument conventions, missing-information
# handling, and confirmation boundaries through v1/v2/v3.
#
# Keep built-in names and supplied evaluation cases unchanged.
# Improve descriptions and compatible schemas. Declare team-built bonus tools
# here and in tools/__init__.py, then test them with team-authored cases.
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Hỏi lại người dùng để thu thập thông tin còn thiếu (như thiếu asset_id, employee_id, hoặc môi trường không rõ ràng) hoặc yêu cầu xác nhận trước khi thực hiện hành động ghi dữ liệu (tạo ticket). Bắt buộc chỉ định response_type: 'text' (hỏi ID/text tự do), 'yes_no' (hỏi xác nhận ticket), hoặc 'choice' (kèm options cụ thể)."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi làm rõ hoặc câu hỏi xác nhận"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu trả lời: 'text' khi hỏi bổ sung ID/text; 'yes_no' khi hỏi xác nhận tạo ticket; 'choice' khi chọn danh sách"}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn nếu có, ví dụ ['production', 'staging'] khi response_type là 'choice'"}
      required: [question, response_type]

  - name: search_kb
    description: "Tìm kiếm hướng dẫn kỹ thuật (how-to), quy trình cài đặt, cấu hình và xử lý sự cố thiết bị hoặc phần mềm. Không dùng cho chính sách hay quy định công ty."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Nội dung cần tìm"}
        category: {type: string, enum: [all, vpn, email, wifi, printing, account, security, hardware, software, meeting_room], default: "all", description: "Nhóm hướng dẫn"}
        top_k: {type: integer, default: 3, description: "Số kết quả"}
      required: [query]

  - name: check_service_status
    description: "Kiểm tra trạng thái hoạt động của các dịch vụ hệ thống dùng chung (vpn, email, sso, wifi, printing) trên môi trường production hoặc staging. Không dùng cho thiết bị máy trạm cá nhân."
    parameters:
      type: object
      properties:
        service: {type: string, enum: [vpn, email, sso, wifi, printing], description: "Tên dịch vụ"}
        environment: {type: string, enum: [production, staging], default: "production", description: "Môi trường hệ thống"}
      required: [service]

  - name: inspect_device
    description: "Kiểm tra thông tin kỹ thuật và chẩn đoán tình trạng của một thiết bị cụ thể theo mã tài sản (asset_id như LT-xxx, PC-xxx). Dùng tham số check cụ thể (vpn, network, security, hardware, software) hoặc all."
    parameters:
      type: object
      properties:
        asset_id: {type: string, description: "Mã tài sản thiết bị"}
        check: {type: string, enum: [all, network, vpn, security, hardware, software], default: "all", description: "Khía cạnh kỹ thuật cần kiểm tra"}
      required: [asset_id]

  - name: lookup_user
    description: "Tra cứu thông tin nhân viên, tài khoản và danh sách thiết bị được cấp theo mã nhân viên trong danh bạ nội bộ. Không gọi inspect_device trừ khi có yêu cầu kiểm tra kỹ thuật thiết bị cụ thể."
    parameters:
      type: object
      properties:
        employee_id: {type: string, description: "Mã nhân viên"}
      required: [employee_id]

  - name: format_incident_report
    description: "Định dạng và tổng hợp các phát hiện/chẩn đoán sự cố thành báo cáo sự cố kỹ thuật. Gọi tool này khi người dùng yêu cầu trình bày hoặc tạo báo cáo sự cố."
    parameters:
      type: object
      properties:
        findings:
          type: array
          default: []
          description: "Các kết quả đã thu thập"
          items:
            type: object
            properties:
              label: {type: string}
              detail: {type: string}
              source: {type: string}
              status: {type: string}
        template: {type: string, enum: [brief, technical, handoff], default: "brief", description: "Mẫu báo cáo"}
        incident_title: {type: string, default: "IT incident", description: "Tiêu đề"}
      required: [findings, template]

  # ---------------- Optional/advanced tools ----------------
  - name: search_device_info
    description: "Tìm thông tin công khai về một model thiết bị trên web. Chỉ truyền hãng, model và loại thông tin; không truyền asset ID, employee ID hoặc dữ liệu nội bộ."
    parameters:
      type: object
      properties:
        manufacturer: {type: string, description: "Hãng sản xuất công khai, ví dụ Lenovo"}
        model: {type: string, description: "Tên model công khai, ví dụ ThinkPad T14 Gen 4"}
        query_type: {type: string, enum: [specs, drivers, support, compatibility], default: "support", description: "Loại thông tin cần tìm"}
        max_results: {type: integer, default: 3, description: "Số kết quả, tối đa 5"}
      required: [manufacturer, model, query_type]

  - name: policy
    description: "Tìm trong chính sách IT nội bộ, quy định bảo mật, quy chế sử dụng tài sản và quy trình phê duyệt của công ty."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Nội dung cần tìm"}
        policy_area: {type: string, enum: [all, access_control, data_privacy, external_tools, incident_response, service_operations, ticketing], default: "all", description: "Nhóm chính sách"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: create_ticket
    description: "Tạo một ticket hỗ trợ kỹ thuật trong hệ thống. CHÚ Ý: Đây là hành động ghi dữ liệu (write action). Tuyệt đối KHÔNG tự ý gọi tool này ngay khi người dùng mới yêu cầu tạo ticket. Phải luôn dùng tool clarify(response_type='yes_no') để hỏi xác nhận trước. Chỉ gọi create_ticket khi người dùng đã có phản hồi xác nhận rõ ràng."
    parameters:
      type: object
      properties:
        summary: {type: string, default: "", description: "Tóm tắt sự cố"}
        priority: {type: string, enum: [low, medium, high, critical], default: "medium", description: "Mức ưu tiên"}
        asset_id: {type: string, default: "", description: "Mã tài sản nếu có"}
        confirmed: {type: boolean, default: false, description: "Đã được người dùng xác nhận"}
      required: [summary]
